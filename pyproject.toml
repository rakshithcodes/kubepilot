[project]
name = "kubepilot"
version = "0.1.0"
description = "AI-powered Kubernetes troubleshooting assistant"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "kubernetes>=36.0.3",
    "rich>=15.0.0",
    "typer>=0.27.0",
]

[project.scripts]
kubepilot = "kubepilot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"